<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Atendimento - Ilúmina Med</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            border-top: 6px solid #c5a059;
        }

        h2 {
            color: #0a3342;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #0a3342;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn-enviar {
            background: #c5a059;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <a href="/" style="display: block; text-align: center; margin-bottom: 20px;">
            <img src="{{ url_for('static', filename='logo_ilumina.PNG') }}" alt="Ilúmina Med"
                style="height: 50px; width: auto;">
        </a>
        <h2>Sua opinião é valiosa</h2>
        <form method="POST">
            <label>Seu Nome:</label>
            <input type="text" name="nome" required placeholder="Como prefere ser chamado?">

            <label>Nota do Atendimento (1 a 5):</label>
            <select name="nota">
                <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
                <option value="4">⭐⭐⭐⭐ (Muito Bom)</option>
                <option value="3">⭐⭐⭐ (Bom)</option>
                <option value="2">⭐⭐ (Regular)</option>
                <option value="1">⭐ (Pode Melhorar)</option>
            </select>

            <label>Seu Comentário:</label>
            <textarea name="comentario" rows="4" required
                placeholder="Conte-nos como foi sua experiência..."></textarea>

            <button type="submit" class="btn-enviar">ENVIAR AVALIAÇÃO</button>
        </form>
    </div>
</body>

</html>
