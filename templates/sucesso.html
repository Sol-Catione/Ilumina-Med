<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Recebido - Ilúmina Med</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a3342;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: white;
            color: #444;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #0a3342;
            font-size: 1.8rem;
        }

        p {
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-confirmar {
            background: #25d366;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-confirmar:hover {
            background: #128c7e;
            transform: scale(1.05);
        }

        .logo-sucesso {
            max-width: 150px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/">
            <img src="{{ url_for('static', filename='logo_ilumina.PNG') }}" class="logo-sucesso" alt="Ilúmina Med">
        </a>
        <h1>Quase lá!</h1>
        <p>Recebemos seus dados e sua ficha clínica com sucesso. Para garantir sua vaga e agilizar o atendimento, clique
            no botão abaixo para nos enviar a ficha via WhatsApp.</p>
        <a href="{{ url_for('enviar_whatsapp', token=token) }}" class="btn-confirmar">CONFIRMAR NO WHATSAPP</a>
    </div>
</body>

</html>
